[package]
name = "token-pulse-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
sha2 = "0.10"
toml_edit = "=0.25.15"
token-pulse-core.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "net", "io-util", "macros"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[features]
test-fixture = []

[[bin]]
name = "notify-channel-fixture"
path = "tests/support/notify-channel-fixture.rs"
required-features = ["test-fixture"]

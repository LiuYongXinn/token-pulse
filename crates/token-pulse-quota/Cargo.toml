[package]
name = "token-pulse-quota"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
token-pulse-core.workspace = true
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "quota-fixture"
path = "tests/support/fixture.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []
local-account-check = []

[[example]]
name = "local_account_check"
required-features = ["local-account-check"]

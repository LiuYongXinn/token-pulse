[package]
name = "token-pulse-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "token-pulse-desktop"

[lib]
name = "token_pulse_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
token-pulse-core.workspace = true
token-pulse-store.workspace = true
token-pulse-collector.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "token-pulse-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "token-pulse-desktop"

[lib]
name = "token_pulse_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2.7.3"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
token-pulse-core.workspace = true
token-pulse-store.workspace = true
token-pulse-collector.workspace = true
token-pulse-quota.workspace = true
token-pulse-taskbar.workspace = true
tokio = { version = "1", features = ["rt", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

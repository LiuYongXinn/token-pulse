[workspace]
members = ["src-tauri", "crates/token-pulse-core", "crates/token-pulse-store", "crates/token-pulse-collector", "crates/token-pulse-quota", "crates/token-pulse-taskbar", "crates/token-pulse-integration"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
token-pulse-core = { path = "crates/token-pulse-core" }
token-pulse-store = { path = "crates/token-pulse-store" }
token-pulse-collector = { path = "crates/token-pulse-collector" }
token-pulse-quota = { path = "crates/token-pulse-quota" }
token-pulse-taskbar = { path = "crates/token-pulse-taskbar" }
token-pulse-integration = { path = "crates/token-pulse-integration" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

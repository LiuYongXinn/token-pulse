[workspace]
members = ["src-tauri", "crates/token-pulse-core", "crates/token-pulse-store", "crates/token-pulse-collector", "crates/token-pulse-quota"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
token-pulse-core = { path = "crates/token-pulse-core" }
token-pulse-store = { path = "crates/token-pulse-store" }
token-pulse-collector = { path = "crates/token-pulse-collector" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

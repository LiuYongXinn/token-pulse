function filters(){return `<div class="filters"><div class="filter-left"><div class="segment" role="group" aria-label="日期范围">${[['today','今天'],['week','近 7 天'],['month','近 30 天']].map(([key,name])=>`<button data-range="${key}" aria-pressed="${state.range===key}">${name}</button>`).join('')}</div><select class="source-select" id="source" aria-label="数据来源"><option value="all" ${state.source==='all'?'selected':''}>全部来源</option><option value="local" ${state.source==='local'?'selected':''}>Windows 本地</option></select></div><div class="filter-right"><small>${stats().date}</small><button class="control" data-action="filters"><span class="button-symbol">${icon('settings',14)}</span> 维度筛选</button></div></div>`}
function cost(){return `<div class="cost"><span class="label">已计价部分估算</span><div class="cost-number data sensitive">$${stats().cost}</div><button class="text-button" data-action="pricing">价格覆盖 ${stats().coverage}</button><p>等价价格估算</p></div>`}
function hero(){const s=stats();return `<section class="hero-summary"><div class="stat-layout"><div><span class="label">${state.range==='today'?'今日':'所选范围'}可信 Token</span><div class="hero-number data" title="${s.exact} Token">${s.total}<small>Token</small></div><div class="hero-meta"><span>${s.sessions} 个会话</span><span>${s.events} 条用量事件</span></div></div>${cost()}</div></section>`}
function composition(withDetails=true){const s=stats();return `<div class="composition" aria-label="非缓存输入占 21.77%，缓存输入占 69.35%，输出占 8.88%"><span style="width:21.77%"></span><span class="cache" style="width:69.35%"></span><span class="output" style="width:8.88%"></span></div>${withDetails?`<div class="breakdown">${[['非缓存输入',s.input,'','输入中未命中的部分'],['缓存输入',s.cache,'cache','占输入总数 76.1%'],['输出总数',s.output,'output','包含推理输出']].map(([name,value,cls,note])=>`<div><div class="legend-label"><i class="swatch ${cls}"></i>${name}</div><div class="data">${value}</div><small>${note}</small></div>`).join('')}</div>`:''}`}
function breakdownPanel(){return `<section class="panel"><div class="panel-heading"><h2>Token 分解</h2><small>缓存包含在输入中</small></div>${composition()}</section>`}
function chart(){const values=state.range==='today'?[0,0,0,0,0,0,0,8,25,43,56,35,19,62,94,73,46,28,12,0,0,0,0,0]:state.range==='week'?[65,48,78,38,60,88,94]:[12,26,20,40,22,32,30,38,56,33,48,39,55,62,42,65,49,68,58,53,75,62,71,80,62,85,72,65,83,94];const valueSum=values.reduce((a,b)=>a+b,0),total=Number(stats().exact.replaceAll(',','')),scale=total/valueSum,axisMax=Math.ceil(100*scale/30000)*30000;const width=620,left=39,plot=width-left-10,step=plot/values.length,bw=Math.min(step*.58,39);let bars='';values.forEach((v,i)=>{const h=v*scale/axisMax*126,x=left+step*i+(step-bw)/2,y=155-h;const label=state.range==='today'?String(i).padStart(2,'0')+':00':state.range==='week'?['09/30','10/01','10/02','10/03','10/04','10/05','10/06'][i]:'第 '+(i+1)+' 天';bars+=`<rect class="bar-input" x="${x}" y="${155-h*.22}" width="${bw}" height="${h*.22}" rx="1"/><rect class="bar-cache" x="${x}" y="${y+h*.09}" width="${bw}" height="${h*.69}"/><rect class="bar-output" x="${x}" y="${y}" width="${bw}" height="${h*.09}" rx="1"/><rect class="chart-hit" tabindex="0" role="button" aria-label="查看 ${label} 用量" data-chart="${label} · ${Math.round(v*scale).toLocaleString('en-US')} Token · 覆盖已确认" x="${left+step*i}" y="12" width="${step}" height="145"/>`});const ticks=state.range==='today'?['00:00','04:00','08:00','12:00','16:00','20:00','23:00']:state.range==='week'?['09/30','10/01','10/02','10/03','10/04','10/05','10/06']:['09/07','09/12','09/17','09/22','09/27','10/02','10/06'];return `<div class="chart-container"><div class="chart-y-labels" aria-hidden="true">${[3,2,1,0].map(i=>`<span>${i===0?'0':Math.round(i*axisMax/3000)+'K'}</span>`).join('')}</div><svg class="chart" viewBox="0 0 620 185" preserveAspectRatio="none" role="group" aria-label="${state.range==='today'?'每小时':'每日'} Token 用量趋势"><g>${[29,71,113,155].map((y,i)=>`<line class="grid-line" x1="39" y1="${y}" x2="612" y2="${y}"/>`).join('')}</g>${bars}${''}</svg><div class="chart-x-labels" aria-hidden="true">${ticks.map(t=>`<span>${t}</span>`).join('')}</div></div>`}
function chartPanel(){return `<section class="panel chart-panel"><div class="chart-heading"><h2>用量趋势</h2><div class="segment" role="group" aria-label="趋势粒度">${(state.range==='today'?[['hour','小时']]:[['day','日']]).map(([k,n])=>`<button aria-pressed="true" data-grain="${k}">${n}</button>`).join('')}</div></div>${chart()}<div class="chart-legend"><span class="legend-label"><i class="swatch"></i>非缓存输入</span><span class="legend-label"><i class="swatch cache"></i>缓存输入</span><span class="legend-label"><i class="swatch output"></i>输出总数</span></div><p id="chart-readout" class="chart-readout" aria-live="polite">选择柱形，查看该时段的用量。</p></section>`}
function heatmap(){let cells='';for(let i=0;i<182;i++){const future=i>=179,level=i<25?0:(i*17+i%11*3)%5;const day=new Date(Date.UTC(2026,3,8+i)).toISOString().slice(0,10);cells+=`<button class="${future?'future':'level-'+level}" data-day="${day}" ${future?'disabled':''} title="${day} · ${future?'未来日期':level?'已确认用量':'已确认零用量'}" aria-label="${day} ${future?'未来日期':'查看活动'}"></button>`}return `<section class="panel activity-panel"><div class="panel-heading"><h2>近期活动</h2><small>近 26 周</small></div><div class="heatmap" role="group" aria-label="每日用量活动">${cells}</div><div class="heat-footer"><span>4 月 — 10 月</span><span class="heat-key">少 <i></i><i></i> 多</span></div></section>`}
function quota(){return `<section class="panel quota-card"><div class="quota-title"><h2>账户额度</h2><span class="tag">已连接</span></div>${state.privacy?'<p class="quota-note">隐私模式已隐藏账户额度。</p>':`<div class="quota-hidden">${[['5 小时额度','72','2 小时 18 分钟后重置'],['周额度','38','10 月 9 日 09:00 重置']].map(([name,num,time])=>`<div class="quota-period"><div><span>${name}</span><strong class="data">${num}<small>%</small></strong></div><div class="meter" role="meter" aria-label="${name}剩余 ${num}%" aria-valuenow="${num}" aria-valuemin="0" aria-valuemax="100"><span style="width:${num}%"></span></div><p>剩余额度 · ${time}</p></div>`).join('')}</div><p class="quota-note">账户范围，独立于本地用量与筛选。<br>最近读取 14:32 · 演示额度</p>`}</section>`}
function recent(){return `<section class="panel recent-panel"><div class="panel-heading"><h2>最近会话</h2><button class="text-button" data-page="sessions">查看全部</button></div><div class="recent-list">${sessions.slice(0,3).map(s=>`<button class="recent-item" data-session="${s.id}" aria-label="查看会话 ${state.privacy?'已隐藏':s.name}"><div><strong class="sensitive">${s.project}</strong><span class="data">${compact(s.total*stats().factor)}</span></div><p class="sensitive">${s.name}</p><div><span class="label">${s.model}</span><time>${s.time}</time></div></button>`).join('')}</div></section>`}
function health(){return `<div class="health-card"><div>${status()}<p>已核对 ${state.source==='all'?'2 个来源':'Windows 本地来源'} · 无待确认观察</p></div><button class="text-button" data-page="diagnostics">查看</button></div>`}
function projectEntry(s,i){return `<button class="project-entry" data-project="${i}"><div><span class="project-icon">${icon('projects',16)}</span><span><strong class="sensitive">${s.project}</strong><span class="label">${s.active?'最近活跃':'已记录'}</span></span></div><div class="value"><span class="data">${compact([1191120,740000,548880][i]*stats().factor)}</span><span class="label">${[48.0,29.8,22.1][i]}%</span></div><div class="meter"><span style="width:${[48.0,29.8,22.1][i]}%"></span></div><p class="sensitive">${s.name}</p></button>`}
function overview(){if(state.theme==='a')return `<div class="overview-a"><div class="overview-main"><section class="summary-open">${hero()}${composition()}</section>${chartPanel()}${heatmap()}</div><div class="overview-side">${quota()}${recent()}${health()}</div></div>`;if(state.theme==='b'){const s=stats();return `<div class="overview-b"><section class="monitor-strip"><div class="monitor-stat"><span class="label">${state.range==='today'?'今日':'所选范围'}可信 Token</span><div class="value data">${s.total}<small> Token</small></div><p>${s.sessions} 个会话 · ${s.events} 条用量事件</p></div><div class="monitor-stat"><span class="label">已计价部分估算</span><div class="value data sensitive">$${s.cost}</div><p><button class="text-button" data-action="pricing">价格覆盖 ${s.coverage}</button></p></div><div class="monitor-stat"><span class="label">缓存 / 输入总数</span><div class="value data">76.1<small>%</small></div><p>输入 ${s.input} + ${s.cache} 缓存</p></div><div class="monitor-stat"><span class="label">未计价 Token</span><div class="value data">${s.unpriced}</div><p>用量已计入 · 费用保持未知</p></div></section><div class="monitor-grid">${chartPanel()}${quota()}</div><div class="monitor-bottom">${heatmap()}${recent()}</div></div>`}return `<div class="desk-top"><div><span class="label">${state.range==='today'?'今日':'所选范围'}可信 Token</span><div class="hero-number data">${stats().total}<small>Token</small></div><div class="hero-meta"><span>${stats().sessions} 个会话</span><span>${stats().events} 条用量事件</span><span>来源已核对</span></div></div><section class="desk-composition">${composition()}</section></div><div class="desk-grid"><section class="panel project-activity"><div class="panel-heading"><h2>项目动态</h2><button class="text-button" data-page="projects">全部</button></div>${sessions.slice(0,3).map(projectEntry).join('')}<div class="desk-cost"><span class="label">已计价部分估算</span><div class="cost-number data sensitive">$${stats().cost}</div><button class="text-button" data-action="pricing">价格覆盖 ${stats().coverage}</button><p>未计价 ${stats().unpriced} Token<br>费用估算独立于账户额度。</p></div></section><div class="overview-main">${chartPanel()}${heatmap()}${health()}</div><div class="overview-side">${quota()}${recent()}</div></div>`}
function pageSummary(){return `<div class="page-summary"><div><span class="label">可信 Token</span><div class="data">${stats().total}</div></div><div><span class="label">已计价部分估算</span><div class="data sensitive">$${stats().cost}</div></div><div><span class="label">价格覆盖</span><div class="data">${stats().coverage}</div></div></div>`}
function modelPage(){const rows=[['gpt-6.1-sol',.56,'76.8%','1.10'],['gpt-6-sol',.299,'74.2%','0.61'],['gpt-6-luna',.085,'79.1%','0.15'],['未识别模型',.056,'未知',null]];return `${pageSummary()}<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>模型</th><th class="numeric">Token 总量</th><th>用量占比</th><th class="numeric">缓存 / 输入</th><th class="numeric">估算费用</th><th>价格依据</th></tr></thead><tbody>${rows.map(([m,share,cache,cost])=>`<tr><td><strong>${m}</strong><small>${cost?'按事件时点价格':'未匹配价格规则'}</small></td><td class="numeric data">${compact(2480000*share*stats().factor)}</td><td>${(share*100).toFixed(1)}%<div class="table-bar"><span style="width:${share*100}%"></span></div></td><td class="numeric">${cache}</td><td class="numeric sensitive">${cost?'$'+(+cost*stats().factor).toFixed(2):'未计价'}</td><td><button class="text-button" data-action="pricing">${cost?'查看依据':'配置规则'}</button></td></tr>`).join('')}</tbody></table></div></section><p class="subpage-note">Token 使用真实记录口径；这里展示合成样本。费用为演示估算，与订阅实付、账户额度分别计算。</p>${breakdownPanel()}`}
function sessionRows(){return sessions.filter(s=>!state.query||(state.privacy?s.model:s.name+s.project+s.model).toLowerCase().includes(state.query.toLowerCase()))}
function sessionsPage(){const rows=sessionRows();return `${pageSummary()}<div class="table-tools"><input class="search" id="session-search" type="search" value="${state.query.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}" placeholder="${state.privacy?'搜索模型':'搜索会话、项目或模型'}" aria-label="搜索会话"><span class="label">${rows.length} 个演示会话 · 按最近活跃排序</span></div><section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>会话 / 项目</th><th>模型</th><th class="numeric">累计消耗</th><th class="numeric">用户回合</th><th>最近请求上下文</th><th>最近活跃</th></tr></thead><tbody>${rows.map(s=>`<tr class="clickable" data-session="${s.id}"><td><button class="text-button sensitive" data-session="${s.id}" aria-label="查看会话 ${state.privacy?'已隐藏':s.name}">${s.name}</button><small class="sensitive">${s.project}</small></td><td>${s.model}</td><td class="numeric data">${compact(s.total*stats().factor)}</td><td class="numeric">${s.turns??'未知'}</td><td>${s.context??'未知'}<small>${s.context?'来自最近请求快照':'未记录可信上下文'}</small></td><td><span class="${s.active?'tag':'label'}">${s.active?'最近活跃':s.time}</span></td></tr>`).join('')}</tbody></table>${rows.length?'':'<p class="empty-result">没有匹配的会话，请调整搜索词。</p>'}</div></section><p class="subpage-note">累计消耗与最近请求上下文分别展示。点击会话查看统计，不展示聊天正文。</p>`}
function projectsPage(){return `${pageSummary()}<div class="projects-grid">${sessions.slice(0,3).map((s,i)=>`<section class="panel">${projectEntry(s,i)}<p class="subpage-note">${[6,4,2][i]} 个会话 · <span class="sensitive">E:/Documents/Code/${s.project}</span></p></section>`).join('')}</div><p class="subpage-note">项目按用量事件发生时的归属统计。点击项目查看演示会话。</p>`}
function eventsPage(){return `${pageSummary()}<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>记录时间</th><th>项目 / 模型</th><th class="numeric">非缓存输入</th><th class="numeric">缓存输入</th><th class="numeric">输出总数</th><th>计价状态</th></tr></thead><tbody>${sessions.map((s,i)=>`<tr><td>${s.time}:08</td><td><strong class="sensitive">${s.project}</strong><small>${s.model}</small></td><td class="numeric data">${(13240+i*3480).toLocaleString('en-US')}</td><td class="numeric data">${(62800+i*4100).toLocaleString('en-US')}</td><td class="numeric data">${(1820+i*723).toLocaleString('en-US')}</td><td><button class="text-button" data-action="pricing">${i===4?'未匹配规则':'查看依据'}</button></td></tr>`).join('')}</tbody></table></div></section><p class="subpage-note">五条代表性演示记录。缓存属于输入，推理属于输出，未知费用保持未计价。</p>`}
function diagnosticsPage(){return `<div class="notice">${state.paused?'Windows 本地来源已暂停。已保存用量继续显示。':'已启用来源采集正常，当前没有待确认观察。'}原始日志只读。</div><div class="settings-grid"><section class="panel source-card"><div class="panel-heading"><h2>Windows 本地</h2><span class="tag">${state.paused?'已暂停':'正常采集'}</span></div><div class="source-path sensitive">C:/Users/Example/.codex</div><p>已发现 1,284 个文件<br>最近成功核对 14:32<br>来源数据保存在本地</p><div class="head-actions" style="margin-top:20px"><button class="control" data-action="detect">重新检测</button><button class="control" data-action="pause">${state.paused?'恢复采集':'暂停采集'}</button></div></section><section class="panel"><div class="panel-heading"><h2>采集与核算问题</h2><span class="tag">无待确认观察</span></div><p class="subpage-note">没有发现影响可信 Token 的采集问题。<br>未匹配价格的用量仍保留在总量中。</p><div class="setting-row"><div><h3>未计价 Token</h3><p>未识别模型缺少价格规则</p></div><span class="data">${stats().unpriced}</span></div><button class="text-button" data-action="pricing">查看价格依据</button></section></div><section class="panel" style="margin-top:18px"><div class="panel-heading"><h2>重建与重读</h2><span class="label">最近任务已完成</span></div><div class="setting-row"><div><h3>重建全部账本</h3><p>重新核算已保存用量。</p></div><button class="control" data-action="rebuild">查看演示</button></div><div class="setting-row"><div><h3>重读已启用来源</h3><p>重新读取日志，完成验证后更新统计。</p></div><button class="control" data-action="reread">查看演示</button></div></section>`}
function settingsPage(){return `<div class="settings-grid"><section class="panel"><div class="panel-heading"><h2>显示与窗口</h2><span class="label">${directions[state.theme].name} 预览</span></div><div class="setting-row"><div><h3>隐私模式</h3><p>隐藏项目、会话名称、费用和账户额度。</p></div><button class="switch" role="switch" aria-label="隐私模式" aria-checked="${state.privacy}" data-action="privacy"></button></div><div class="setting-row"><div><h3>悬浮小窗</h3><p>查看今日消耗与账户剩余。</p></div><button class="control primary" data-action="mini">预览</button></div><div class="setting-row"><div><h3>任务栏显示</h3><p>在 Windows 任务栏保留简洁读数。</p></div><button class="control" data-action="taskbar">预览</button></div><div class="setting-row"><div><h3>统计时区</h3><p>日期边界与重置时间使用同一时区。</p></div><span class="label">Asia/Shanghai</span></div></section><section class="panel"><div class="panel-heading"><h2>数据与账户</h2></div><div class="setting-row"><div><h3>数据来源</h3><p>管理本地 Codex 日志来源。</p></div><button class="text-button" data-page="diagnostics">查看来源</button></div><div class="setting-row"><div><h3>账户额度</h3><p>账户额度独立于会话消费。</p></div><span class="tag">演示已连接</span></div><div class="setting-row"><div><h3>模型价格</h3><p>未匹配的用量保持未计价。</p></div><button class="text-button" data-action="pricing">查看规则</button></div><div class="setting-row"><div><h3>软件更新</h3><p>此原型仅用于设计比较。</p></div><span class="label">TokenPulse</span></div></section></div>`}
function mini(){return state.mini?`<aside class="mini-widget" aria-label="悬浮小窗预览"><header><span>${icon('pulse',14)} TokenPulse <span class="tag">演示</span></span><button class="icon-button" aria-label="关闭悬浮窗预览" data-action="close-mini">${icon('close',13)}</button></header><div class="mini-value data">2.48M<small>今日 Token</small></div>${composition(false)}<div class="mini-row"><span>12 个会话</span><span class="sensitive">估算 $1.86</span></div>${state.miniExpanded?'<div class="mini-extra">非缓存输入 540K · 缓存输入 1.72M<br>输出 220K · 价格覆盖 94.4%<br>固定今日全部来源，不随主窗筛选。</div>':''}<footer><div class="mini-row"><span>5 小时剩余 <b>${state.privacy?'已隐藏':'72%'}</b></span><span>周剩余 <b>${state.privacy?'已隐藏':'38%'}</b></span></div><div class="mini-row"><span>${state.privacy?'重置时间已隐藏':'周重置 10/09 09:00'}</span><button class="text-button" data-action="expand-mini">${state.miniExpanded?'收起':'展开'}</button></div></footer></aside>`:''}
function render(){const app=$('#app');app.dataset.theme=state.theme;app.classList.toggle('privacy',state.privacy);const view={overview,models:modelPage,projects:projectsPage,sessions:sessionsPage,events:eventsPage,diagnostics:diagnosticsPage,settings:settingsPage}[state.page]();const foot=`<footer class="footnote"><span>Asia/Shanghai · 原始日志只读 · 合成演示数据</span><span>统计快照 2026-10-06 14:32</span></footer>`;const main=`<div class="main">${heading()}${filters()}${view}${foot}</div>`;app.innerHTML=`<div class="titlebar"><span><span class="tiny-mark">${icon('pulse',13)}</span>TokenPulse · ${directions[state.theme].name}<span class="tag">设计原型</span></span><div class="window-controls" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div></div>${state.theme==='b'?`<div class="top-shell"><header class="top-navigation">${brand()}${navigation()}${status()}</header>${main}</div>`:`<div class="body-shell ${state.theme==='c'?'desk-shell':''}">${sidebar(false)}${main}</div>`}${mini()}`;document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.direction===state.theme));$('#direction-note').textContent=directions[state.theme].note;document.title=`TokenPulse · ${directions[state.theme].name} UI 预览`;renderButtonLab();}
function renderButtonLab(){const lab=$('#button-lab');lab.dataset.theme=state.theme;const cs=getComputedStyle($('#app'));['--fg','--muted','--line','--surface','--sub','--accent','--accent-soft','--positive'].forEach(k=>lab.style.setProperty(k,cs.getPropertyValue(k)));lab.innerHTML=`<div class="lab-heading"><div><h2>${directions[state.theme].name} · 按钮设计板</h2><p>把鼠标移上去、按下，再用 Tab 查看焦点状态。</p></div><span>轮廓 / 图标 / 触感 / 状态</span></div><div class="lab-grid"><article><h3>主要操作</h3><button class="control primary lab-primary" data-action="demo"><span class="button-symbol">${icon('check',15)}</span>连接账户</button><p>把主要动作做成能一眼识别的操作件。</p></article><article><h3>次要操作</h3><button class="control" data-action="demo"><span class="button-symbol">${icon('refresh',15)}</span>核对来源</button><p>保持相同的形状语言，降低强调程度。</p></article><article><h3>选中与切换</h3><div class="segment" role="group" aria-label="按钮样式日期演示"><button data-lab="today" aria-pressed="true">今天</button><button data-lab="week" aria-pressed="false">近 7 天</button><button data-lab="month" aria-pressed="false">近 30 天</button></div><p>用形状和对比同时表达当前选择。</p></article><article><h3>图标操作</h3><div class="lab-icons"><button class="icon-button" data-action="demo" aria-label="图标按钮演示：隐私">${icon('eye',18)}</button><button class="icon-button" data-action="demo" aria-label="图标按钮演示：置顶">${icon('pin',18)}</button><button class="icon-button" disabled aria-label="禁用按钮演示">${icon('mini',18)}</button></div><p>保留足够点击面积，禁用状态清楚可辨。</p></article></div><div class="lab-states"><span>主要按钮状态</span><button class="control primary" data-action="demo">默认</button><button class="control primary force-hover" data-action="demo">悬停</button><button class="control primary force-active" data-action="demo">按下</button><button class="control primary force-focus" data-action="demo">键盘焦点</button><button class="control primary" disabled>不可用</button></div>`}
function switchTheme(t){state.theme=t;$('#detail').close();$('#comparison').close();const url=new URL(location.href);url.searchParams.set('style',t);try{history.replaceState(null,'',url)}catch{}render()}
function toast(message){$('#announcements').innerHTML=`<div class="toast" role="status">${message}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#announcements').innerHTML='',3600)}
function dialog(title,body){const d=$('#detail');d.classList.add('themed-dialog');d.dataset.theme=state.theme;const app=$('#app');const cs=getComputedStyle(app);['--fg','--muted','--line','--surface','--sub','--accent','--accent-soft','--display','--radius'].forEach(k=>d.style.setProperty(k,cs.getPropertyValue(k)));d.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button data-action="close-dialog" aria-label="关闭对话框">×</button></div><div class="dialog-content">${body}</div>`;d.showModal()}
function openSession(id){const s=sessions[id];dialog('会话详情',`<p>${state.privacy?'会话名称与项目已隐藏':s.name+' · '+s.project}</p><div class="hero-number data">${compact(s.total*stats().factor)}<small>累计 Token</small></div><p>累计消耗独立于最近请求上下文，不显示聊天正文。</p><div class="detail-grid"><section class="panel"><h3>会话统计</h3><dl><dt>模型</dt><dd>${s.model}</dd><dt>用户回合</dt><dd>${s.turns??'未知'}</dd><dt>最近活跃</dt><dd>2026-10-06 ${s.time}</dd><dt>项目</dt><dd>${state.privacy?'已隐藏':s.project}</dd></dl></section><section class="panel"><h3>最近请求上下文</h3><div class="hero-number data">${s.context??'未知'}</div><p>${s.context?'来自最近请求记录。缺少可信窗口容量，不显示占用百分比。':'没有可信上下文快照，未知不会显示为零。'}</p></section></div>`)}
function openPricing(){dialog('价格与核算依据',`<p>当前范围的可信 Token：${stats().total}。其中 ${stats().coverage} 已匹配演示价格规则，${stats().unpriced} Token 未计价。</p><div class="detail-grid"><section class="panel"><h3>已计价部分估算</h3><div class="hero-number data">${state.privacy?'已隐藏':'$'+stats().cost}</div><p>使用合成演示费率，按事件时点匹配。不能作为官方报价或订阅实付。</p></section><section class="panel"><h3>未计价部分</h3><div class="hero-number data">${stats().unpriced}</div><p>未识别模型缺少规则。用量保留在总量中，未知费用保持未计价。</p></section></div><p style="margin-top:20px">账户额度来自独立账户服务，不使用本地 Token 或费用换算。</p>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-session],[data-project]');if(!b)return;if(b.dataset.lab){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}if(b.dataset.direction){switchTheme(b.dataset.direction);return}if(b.dataset.page){state.page=b.dataset.page;state.query='';render();return}if(b.dataset.range){state.range=b.dataset.range;state.grain=state.range==='today'?'hour':'day';render();return}if(b.dataset.session){openSession(+b.dataset.session);return}if(b.dataset.project){state.page='sessions';state.query=state.privacy?'':sessions[+b.dataset.project].project;render();return}if(b.dataset.chart){$('#chart-readout').textContent=b.dataset.chart;return}if(b.dataset.day){toast(`${b.dataset.day} · 每日活动演示。正式版可跳转该日统计。`);return}const action=b.dataset.action;if(action==='demo'){toast('操作反馈预览 · 此按钮不修改真实设置');return}if(action==='privacy'){state.privacy=!state.privacy;state.query='';render()}else if(action==='mini'){state.mini=!state.mini;render()}else if(action==='close-mini'){state.mini=false;render()}else if(action==='expand-mini'){state.miniExpanded=!state.miniExpanded;render()}else if(action==='close-dialog')$('#detail').close();else if(action==='refresh')toast('演示快照已刷新 · 不读取真实日志或账户');else if(action==='pricing')openPricing();else if(action==='pause'){state.paused=!state.paused;render();toast(state.paused?'演示来源已暂停，历史用量保留。':'演示来源已恢复采集。')}else if(action==='detect')toast('演示来源可读 · 1,284 个文件');else if(action==='filters')dialog('维度筛选',`<p>可从模型、项目和会话进入对应视图。</p><div class="head-actions" style="margin-top:20px"><button class="control" data-page="models" data-action="close-dialog">按模型查看</button><button class="control" data-page="projects" data-action="close-dialog">按项目查看</button><button class="control" data-page="sessions" data-action="close-dialog">按会话查看</button></div>`);else if(action==='taskbar')dialog('任务栏读数预览',`<p>简洁读数沿用当前方案的颜色与数字样式。以下为合成演示。</p><div class="panel" style="margin-top:20px;display:flex;align-items:center;gap:24px;padding:16px 20px">${icon('pulse',23)}<div><span class="label">今日 Token</span><div class="data" style="font-size:22px;margin-top:4px">2.48M</div></div><div><span class="label">估算</span><div class="data" style="font-size:22px;margin-top:4px">${state.privacy?'已隐藏':'$1.86'}</div></div><div><span class="label">周剩余</span><div class="data" style="font-size:22px;margin-top:4px">${state.privacy?'已隐藏':'38%'}</div></div></div>`);else if(action==='rebuild'||action==='reread')dialog(action==='rebuild'?'重建全部账本':'重读已启用来源',`<p>${action==='rebuild'?'正式版将重新核算已保存的用量。':'正式版将重新读取已启用来源中的日志，验证成功后替换统计。'}</p><div class="notice" style="margin-top:20px">此处仅展示交互样式，不执行实际任务。处理中保留上次统计，提供进度与取消入口。</div><div class="meter"><span style="width:68%"></span></div><p>演示进度 68% · 原始日志保持只读</p>`)});
document.addEventListener('change',e=>{if(e.target.id==='source'){state.source=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='session-search'){const pos=e.target.selectionStart;state.query=e.target.value;render();const input=$('#session-search');input.focus();try{input.setSelectionRange(pos,pos)}catch{}}});
document.addEventListener('keydown',e=>{const chart=e.target.closest('[data-chart]');if(chart&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#chart-readout').textContent=chart.dataset.chart}});
document.addEventListener('focusin',e=>{if(e.target.dataset.chart)$('#chart-readout').textContent=e.target.dataset.chart});
$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
$('#compare').addEventListener('click',()=>{$('#comparison').innerHTML=`<div class="dialog-head"><h2>选择你想每天打开的那一版</h2><button id="close-comparison" aria-label="关闭对比">×</button></div><div class="dialog-content"><div class="comparison-grid">${Object.entries(directions).map(([key,d])=>`<article><img src="../docs/images/ui-direction-${key}.png" alt="${d.name}总览完整截图"><h3>${key.toUpperCase()} · ${d.name}</h3><p>${d.desc}</p><button data-direction="${key}">体验这版</button></article>`).join('')}</div><p style="margin-top:20px">你也可以组合：例如银雾的总览布局，加上碳素的深色表现，或纸墨的悬浮窗。</p></div>`;$('#comparison').showModal();$('#close-comparison').onclick=()=>$('#comparison').close()});
// Close the dimension dialog when navigation takes place inside it.
document.addEventListener('click',e=>{if(e.target.closest('[data-page]')&&$('#detail').open)$('#detail').close()});
render();
</script>
</body>
</html>

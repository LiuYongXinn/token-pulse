document.addEventListener('change',e=>{const t=e.target;if(t.id.startsWith('taskbar-')){taskbar[t.id.slice(8)]=t.value;render();if(taskbar.scenario==='unavailable'&&taskbar.fallback){openTaskbarFloat();toast('嵌入失败，已显示悬浮窗（预览）。');}}if(t.dataset.taskbarField){const k=t.dataset.taskbarField;taskbar.fields[k]=t.checked;if(!Object.values(taskbar.fields).some(Boolean)){taskbar.fields[k]=true;toast('至少保留一个显示项目。');}render();}});
document.addEventListener('keydown',e=>{if(!$('taskbar-menu').classList.contains('hidden')){const items=[...$('taskbar-menu').querySelectorAll('button')],i=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();items[e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}if(e.key==='Tab'){hideTaskbarMenu();}}});

function action(a){switch(a){case'dismiss':dismiss();break;case'float':state.float=true;$('floating-stage').classList.remove('hidden');renderFloat();break;case'hide-float':state.float=false;$('floating-stage').classList.add('hidden');toast('悬浮窗已隐藏；正式应用中后台继续采集。');break;case'expand-float':state.expanded=!state.expanded;renderFloat();break;case'float-breakdown':if(state.demo==='empty'){action('add-source');break;}state.expanded=true;renderFloat();break;case'pin-window':preferences['悬浮窗置顶']=!preferences['悬浮窗置顶'];renderFloat();toast('置顶偏好已更新（预览）；原生置顶由桌面壳实现。');break;case'open-from-float':state.page=state.pinned==='all'?'overview':'sessions';state.period='today';state.source='all';state.model='all';state.project='all';render();if(state.pinned!=='all')openSession(state.pinned);break;case'reset':state.period='today';state.grain='hour';state.source=state.model=state.project='all';eventPage=1;render();break;case'refresh':$('refresh').textContent='正在核对…';$('refresh').disabled=true;setTimeout(()=>{$('refresh').textContent='核对来源';$('refresh').disabled=false;toast('演示核对完成。原型未访问本机日志。');},700);break;case'retry':state.demo='ready';$('demo-state').value='ready';render();toast('演示查询已恢复。');break;case'export':openModal('导出当前筛选',`<p>将导出 ${filtered().length} 条演示记录。日期、来源、模型和项目条件与当前页面一致。</p><label for="export-format">文件格式</label><select id="export-format"><option value="csv">CSV · 适合表格分析</option><option value="json">JSON · 包含口径与筛选信息</option></select><label><input type="checkbox" id="hide-path" ${state.privacy?'checked':''} style="width:auto"> 隐藏项目名称与路径</label><p>费用均使用虚构价格。JSON 包含时区、快照、价格规则与未计价标记；CSV 保留逐条口径与规则标记。</p>`,'<button class="primary" data-action="download">导出演示数据</button>');break;case'download':exportFile();break;case'cache-detail':openModal('输入缓存占比','<p>缓存占比 = 缓存输入 / 输入总数。</p><p>当前筛选：缓存 '+full(stats().cache)+' Token，输入总数 '+full(stats().input)+' Token，占比 '+percent(stats().cache,stats().input)+'。</p><p>缓存已经包含在输入总数中，不再次计入总量。</p>');break;case'quota-detail':openQuotaDetails();break;case'float-price':{const rows=events.filter(e=>e.date==='2026-10-01'&&(state.pinned==='all'||e.session.id===state.pinned)),a=state.demo==='zero'?sum([]):sum(rows),session=sessionDefs.find(x=>x.id===state.pinned);openModal('悬浮窗费用估算',`<p class="${session?'sensitive':''}">${session?esc(session.project)+' · 今日会话消耗':'全部来源 · 今日用量'}</p><p>已计价部分估算：<strong class="num cost-sensitive">${a.total&&a.unpriced===a.total?'未计价':money(a.cost)}</strong></p><p>价格覆盖 ${percent(a.total-a.unpriced,a.total)}；未计价 ${full(a.unpriced)} Token。</p><p>费用与悬浮窗中的用量采用同一统计范围。原型使用虚构价格，正式应用为等价价格估算。</p>`,'<button class="primary" data-action="open-pricing">管理价格规则</button>');break;}case'prices':openModal('费用与价格依据','<p>费用表示已计价用量的等价价格估算。订阅实付和账户剩余额度不由本工具推断。</p><div class="notice">演示价格：输入 $1.20、缓存 $0.12、输出 $6.00 / 百万 Token。均为虚构系数。</div><p>非缓存输入 × 输入单价 + 缓存输入 × 缓存单价 + 输出总数 × 输出单价。</p><p>推理已包含在输出中，不再次计价。未知价格保持未计价，并保留在可信总量中。</p><p>正式应用展示：规则来源、生效时间、别名匹配、价格覆盖率和最近重算时间。</p>','<button class="primary" data-action="open-pricing">管理价格规则</button>');break;case'open-pricing':dismiss();state.page='settings';state.settingsTab='pricing';render();break;case'add-source':openModal('添加 Codex 数据来源','<p>原型仅演示目录确认步骤。正式应用使用系统目录选择器，再检测目录可读性与重复来源。</p><label for="source-path">Codex Home 路径</label><input id="source-path" placeholder="例如 C:/Users/你的用户名/.codex"><p>扫描 sessions 和 archived_sessions。不会读取 auth.json，也不会修改原始日志。</p>','<button class="primary" data-action="confirm-source">检测演示目录</button>');break;case'confirm-source':if(!$('source-path').value.trim()){$('source-path').setCustomValidity('请填写目录路径');$('source-path').reportValidity();return;}dismiss();state.demo='loading';$('demo-state').value='loading';state.page='diagnostics';render();toast('进入导入预览；未添加真实来源。');break;case'pause-source':sourcePaused=!sourcePaused;render();toast(sourcePaused?'演示来源已暂停；统计保留。':'演示来源已恢复。');break;case'check-source':toast('演示目录可读；未访问真实文件。');break;case'pause-import':importPaused=!importPaused;render();toast(importPaused?'演示导入已暂停。':'演示导入已继续。');break;case'remove-source':openModal('移除来源','<p>正式应用提供“停止采集并保留统计”和“清除本工具保存的该来源数据”两种选项。</p><p>任何选项均不会删除 Codex 原始日志。本原型仅展示影响范围。</p>');break;case'diagnostic-detail':openModal('计数歧义定位','<p class="sensitive">来源：Windows 本地 · token-pulse</p><dl><dt>文件代次</dt><dd>demo-generation-3</dd><dt>字节偏移</dt><dd>42,816</dd><dt>问题</dt><dd>累计值可匹配多个计数流，无法唯一确定新增用量。</dd></dl><p>待确认用量未计入总量。正式应用可定位文件、查看必要元数据或重新构建；原文采样默认关闭。</p>');break;case'rebuild':openModal('重建指定来源','<p>重新读取所选来源，验证候选结果后切换统计。重建期间仍可查看原结果。</p><label for="rebuild-source">数据来源</label><select id="rebuild-source"><option>Windows 本地</option><option>WSL · Ubuntu</option></select><p>原型演示任务反馈，不重读或写入任何真实文件。</p>','<button class="primary" data-action="confirm-rebuild">演示重建</button>');break;case'confirm-rebuild':dismiss();toast('演示重建已完成；原始日志未访问。');break;case'backup':openModal('创建备份','<p>正式应用通过一致备份保存统计库与配置，备份包含项目路径和统计记录。</p><p>原型尚未接入数据库，不生成真实备份。</p>');break;case'clear-data':openModal('清除数据的影响范围','<p>正式应用分别提供清除缓存、运行日志、诊断样本或全部统计数据的操作。</p><p>清除账本需要明确确认，并在安全停止任务后执行。显示设置恢复默认不清空统计。</p><p>本原型不会删除任何数据。</p>');break;case'passthrough':openModal('鼠标穿透与恢复','<p>启用后，点击将传递到悬浮窗下方的窗口。</p><p>正式应用先注册并校验恢复快捷键；若发生冲突，保留原状态并提示更换快捷键。托盘始终提供“恢复悬浮窗交互”。</p><p>浏览器原型只演示说明，无法实现系统级穿透。</p>');break;case'locate-log':toast('正式应用会定位来源文件；原型未打开真实日志。');break;case'prev-events':eventPage=Math.max(1,eventPage-1);render();break;case'next-events':eventPage++;render();break;case'close-main':case'minimize':toast('正式应用中窗口隐藏，后台采集继续；托盘提供恢复和退出。');break;case'maximize':toast('统计窗口默认 1280 × 860 DIP，最小 960 × 680 DIP。');break;}}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-session],[data-backdrop]');if(!t)return;if(t.dataset.backdrop){dismiss();return;}if(t.dataset.page){state.page=t.dataset.page;render();return;}if(t.dataset.session){openSession(t.dataset.session);return;}if(t.dataset.period){if(t.dataset.period==='custom'){openModal('自定义日期范围',`<label for="date-start">开始日期</label><input type="date" id="date-start" value="${state.start}" max="2026-10-01"><label for="date-end">结束日期（含当天）</label><input type="date" id="date-end" value="${state.end}" max="2026-10-01"><p>统计时区：Asia/Shanghai。演示数据范围为 2026-09-02 至 2026-10-01。</p>`,'<button class="primary" id="apply-dates">应用日期</button>');}else{state.period=t.dataset.period;state.grain=state.period==='today'?'hour':'day';eventPage=1;render();}return;}if(t.id==='apply-dates'){const start=$('date-start').value,end=$('date-end').value;if(!start||!end||start>end){toast('开始日期必须早于或等于结束日期。');return;}state.start=start;state.end=end;state.period='custom';state.grain='day';dismiss();render();return;}if(t.dataset.grain){state.grain=t.dataset.grain;render();return;}if(t.dataset.settings){state.settingsTab=t.dataset.settings;render();return;}if(t.dataset.project){state.project=t.dataset.project;state.page='sessions';render();return;}if(t.dataset.toggle){const k=t.dataset.toggle;if(k==='隐私模式')state.privacy=!state.privacy;else{preferences[k]=!preferences[k];toast(k+'偏好已更新（仅原型内）。');}render();return;}if(t.id==='privacy'){state.privacy=!state.privacy;render();toast(state.privacy?'隐私模式已开启。':'隐私模式已关闭。');return;}if(t.id==='theme'){setTheme(document.body.classList.contains('theme-dark')?'light':'dark');return;}if(t.dataset.action)action(t.dataset.action);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.filter){state[t.dataset.filter]=t.value;eventPage=1;render();}if(t.id==='demo-state'){state.demo=t.value;render();}if(t.id==='session-sort'){state.sort=t.value;render();}if(t.id==='appearance-theme')setTheme(t.value);if(t.id==='account-demo'){accountDemo=t.value;if(state.float)renderFloat();renderTaskbar();}if(t.id==='pin-session'){state.pinned=t.value;renderFloat();renderTaskbar();}});
document.addEventListener('input',e=>{if(e.target.id==='opacity'){$('floating-stage').style.opacity=e.target.value/100;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const hadMenu=!$('taskbar-menu').classList.contains('hidden');hideTaskbarTip();hideTaskbarMenu();if(hadMenu){$('taskbar-widget')?.focus({preventScroll:true});hideTaskbarTip();return;}dismiss();return;}const dialog=$('overlays').querySelector('[role="dialog"]');if(dialog&&e.key==='Tab'){const list=[...dialog.querySelectorAll('button,input,select,a,[tabindex="0"]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0]?.focus();}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-session]')){e.preventDefault();openSession(e.target.dataset.session);}});
render();
</script>
</body></html>

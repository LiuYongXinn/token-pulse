name: Checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: npm run contracts:check
      - run: cargo run -p token-pulse-taskbar --example export_host_contract -- --check
      - run: npm run test
      - run: node scripts/project-run.mjs playwright install chromium
      - run: npm run test:e2e
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p token-pulse-quota --features test-fixture
      - run: cargo clippy -p token-pulse-quota --all-targets --features test-fixture -- -D warnings
      - run: npm run test:native
      - run: npm run tauri:build -- --no-bundle
